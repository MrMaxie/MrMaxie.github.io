<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Maciej Mieńko - social banner</title>
    <style>
    @font-face {
      font-family: Outfit;
      src: url("{{outfit}}");
      font-weight: 100 900;
    }
    @font-face {
      font-family: Outfit;
      src: url("{{outfitExtended}}");
      font-weight: 100 900;
      unicode-range: U+0100-024F;
    }
    @font-face {
      font-family: Karla;
      src: url("{{karla}}");
      font-weight: 200 800;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #131315;
      color: #f3f3f5;
      font-family: Karla, sans-serif;
    }
    main {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 64px;
      overflow: hidden;
    }
    .domain {
      margin: 0;
      font:
        500 25px Outfit,
        sans-serif;
      letter-spacing: -0.5px;
    }
    .domain span {
      color: #79c9ff;
    }
    .copy {
      position: absolute;
      top: 160px;
      left: 64px;
      z-index: 1;
    }
    .role {
      margin: 0 0 20px;
      color: #79c9ff;
      font-size: 24px;
    }
    h1 {
      margin: 0;
      font:
        500 76px / 1.08 Outfit,
        sans-serif;
      letter-spacing: -3.8px;
    }
    .alias {
      margin: 16px 0 0;
      color: #bfbfc5;
      font:
        400 28px Outfit,
        sans-serif;
    }
    .alias span {
      color: #f3f3f5;
    }
    .description {
      max-width: 640px;
      margin: 34px 0 0;
      color: #bfbfc5;
      font-size: 24px;
      line-height: 1.45;
    }
    .description p {
      margin: 0;
      text-wrap: balance;
    }
    .description p + p {
      margin-top: 12px;
    }
    .portrait {
      position: absolute;
      right: 30px;
      top: 120px;
      width: 440px;
      height: 440px;
      object-fit: contain;
      mask-image: linear-gradient(to bottom, #000 68%, transparent 99%);
    }
    .footer {
      position: absolute;
      bottom: 48px;
      left: 64px;
      right: 64px;
      border-top: 1px solid #35353b;
      padding-top: 20px;
      color: #bfbfc5;
      font-size: 19px;
    }
    </style>
  </head>
  <body>
    <main>
      <p class="domain">maxie<span>.dev</span></p>
      <div class="copy">
        <p class="role">Software developer</p>
        <h1>Maciej Mieńko</h1>
        <p class="alias">Usually <span>Maxie</span> online.</p>
        <div class="description">
          <p>I build software, from developer tools to games.</p>
          <p>Understanding the mechanism is often the part I enjoy most.</p>
        </div>
      </div>
      <img class="portrait" src="{{portrait}}" alt="Portrait of Maciej Mieńko">
      <div class="footer">github.com/<span style="color: #f3f3f5">MrMaxie</span></div>
    </main>
  </body>
</html>
