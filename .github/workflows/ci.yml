name: CI

on:
  push:
    branches: [master, feat/2.0, fix/production-audit-regressions]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - run: nub ci
      - run: just ci
      - run: nub exec playwright install --with-deps chromium
      - name: Prepare trusted HTTP/2 preview
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libnss3-tools
          tls_dir="$RUNNER_TEMP/portfolio-preview-tls"
          mkdir -p "$tls_dir"
          umask 077
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$tls_dir/key.pem" -out "$tls_dir/cert.pem" \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -addext 'basicConstraints=critical,CA:FALSE' \
            -addext 'keyUsage=critical,digitalSignature,keyEncipherment' \
            -addext 'extendedKeyUsage=serverAuth'
          nss_dir="$HOME/.local/share/pki/nssdb"
          if [ -d "$HOME/.pki/nssdb" ]; then nss_dir="$HOME/.pki/nssdb"; fi
          mkdir -p "$nss_dir"
          if ! certutil -d "sql:$nss_dir" -L >/dev/null 2>&1; then
            certutil -d "sql:$nss_dir" -N --empty-password
          fi
          certutil -d "sql:$nss_dir" -A -t 'P,,' -n portfolio-preview -i "$tls_dir/cert.pem"
          printf 'AUDIT_TLS_CERT=%s\nAUDIT_TLS_KEY=%s\nNODE_EXTRA_CA_CERTS=%s\n' \
            "$tls_dir/cert.pem" "$tls_dir/key.pem" "$tls_dir/cert.pem" >> "$GITHUB_ENV"
      - name: Accessibility and interaction audit
        id: accessibility
        run: nub --test --experimental-strip-types tests/browser.audit.ts
        env:
          AUDIT_OUTPUT_DIR: ${{ runner.temp }}/site-audits
      - name: Lighthouse mobile and desktop gates
        if: ${{ !cancelled() && steps.accessibility.outcome != 'skipped' }}
        run: nub --experimental-strip-types scripts/lighthouse-audit.ts
        env:
          AUDIT_OUTPUT_DIR: ${{ runner.temp }}/site-audits
      - name: Preserve audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-audits
          path: ${{ runner.temp }}/site-audits
          if-no-files-found: warn
          retention-days: 14
